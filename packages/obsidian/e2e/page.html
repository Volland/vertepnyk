<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>obsidian mock</title>
    <link rel="stylesheet" href="/plugin/styles.css" />
    <style>
      /* a dark Obsidian default-ish theme */
      body {
        --background-primary: #1e1e1e;
        --background-secondary: #262626;
        --background-modifier-border: #3b3b3b;
        --text-normal: #dadada;
        --text-muted: #b3b3b3;
        --text-error: #fb464c;
        --interactive-accent: #7b6cd9;
        --color-orange: #e0752d;
        --color-yellow: #e0ac00;
        --font-interface: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-monospace: ui-monospace, Menlo, monospace;
        --font-ui-small: 13px;
        margin: 0;
        background: var(--background-primary);
        color: var(--text-normal);
        font-family: var(--font-interface);
      }
      .note { max-width: 760px; margin: 0 auto; padding: 24px 32px; line-height: 1.6; }
      .note h1 { font-size: 2em; margin: 0 0 12px; }
      .note button { background: var(--background-modifier-border); color: var(--text-normal); border: 1px solid var(--background-modifier-border); border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body class="theme-dark">
    <div class="note" id="note">
      <h1>Order flow</h1>
      <p>The traffic light below is a <code>vertep</code> code block. It renders as a chart in reading mode.</p>
      <div id="block"></div>
      <p>Closing words: the chart above can be simulated in place, or edited in a modal.</p>
      <div id="embed"><p><span class="internal-embed file-embed" src="traffic-light.scxml">traffic-light.scxml</span></p></div>
    </div>
    <script src="/harness.js"></script>
  </body>
</html>
